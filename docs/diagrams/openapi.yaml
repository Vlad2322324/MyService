openapi: 3.0.3

info:
  title: MyService API
  description: хз че делает пока
  version: 1.0.0

servers:
  - url: /MyService
    description: Базовый путь

paths:
  /user:
    post:
      summary: Добавить пользователя
      tags:
        - user
      operationId: InsertUser

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'

      responses:
        '200':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

        'default':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /user/{id}:
    get:
      summary: Получить пользователя по ID
      tags:
        - user
      operationId: GetUserById

      parameters:
        - name: id
          in: path
          required: true
          description: ID пользователя
          schema:
            type: integer
            example: 1

      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

        'default':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      summary: Полное обновление пользователя
      tags:
        - user
      operationId: UpdateUser

      parameters:
        - name: id
          in: path
          required: true
          description: ID пользователя
          schema:
            type: integer
            example: 1

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'

      responses:
        '200':
          description: Пользователь обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

        'default':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      summary: Удалить пользователя
      tags:
        - user
      operationId: DeleteUser

      parameters:
        - name: id
          in: path
          required: true
          description: ID пользователя
          schema:
            type: integer
            example: 1

      responses:
        '200':
          description: Успешное удаление

        'default':
          description: Ошибка
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    User:
      type: object
      required:
        - id
        - name
        - createdAt
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: "John Doe"
        createdAt:
          type: string
          format: date-time
          example: "2026-05-21T12:34:56Z"

    Error:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
        message:
          type: string